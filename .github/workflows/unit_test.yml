name: "Unit Tests (manual)"

# Standalone, manual-only workflow that builds wxUiEditor with the unit tests
# enabled and runs them. This duplicates the test capability that was briefly
# added to build-unix-reusable.yml / pr_verify.yml; it is intentionally NOT
# wired into PR verification yet, so the only trigger is workflow_dispatch --
# start it by hand from the Actions tab when you want to exercise the tests.

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'

env:
  BUILD_TYPE: ${{ inputs.build-type }}
  SCCACHE_DIR: ${{github.workspace}}/.sccache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unitTest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install unzip (required by get-cmake)
      run: sudo apt-get update && sudo apt-get install -y unzip

    - name: Setup CMake 4.2+ and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 'latest'
        ninjaVersion: 'latest'

    - run: mkdir ${{github.workspace}}/build

    - name: Install other dependencies
      run: |
        sudo apt-get update
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble main'
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev clang-20 llvm-20-tools g++-14
        clang-20 --version
        cmake --version

    - name: Install xvfb (virtual display for the CLI and wxPython tests)
      run: sudo apt-get install -y xvfb

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Create dummy wxWidgetsDocs.zip (skip docs build)
      run: |
        mkdir -p ${{github.workspace}}/build/archive
        # Non-empty file: build_docs.cmake only checks existence, and CMakeRC
        # embeds the bytes without parsing them, so any content is fine for linking.
        echo "Dummy wxWidgets docs archive for link-time verification" > ${{github.workspace}}/build/archive/wxWidgetsDocs.zip

    # Note: FetchContent is intentionally NOT cached. The kwxFetch repo updates
    # weekly from wxWidgets master, and stale cache can cause build failures
    # due to partial/mismatched source files.

    # ── Build with tests enabled ───────────────────────────────────────────
    # PGO is not used here: profile collection has to run the GUI (GTK), which
    # cannot start on a headless runner.

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 -DINTERNAL_BLD_TESTING=ON -DWXUI_BUILD_TESTS=ON

    - name: Build wxUiEditor
      run: cmake --build ${{github.workspace}}/build -j$(nproc) --config ${{env.BUILD_TYPE}} --target wxUiEditor

    - name: Build unit tests
      run: cmake --build ${{github.workspace}}/build -j$(nproc) --config ${{env.BUILD_TYPE}} --target wxui_tests

    - name: Run tests
      # A wxWidgets GUI application needs a display connection to initialize even when
      # it only generates code, so the CLI tests have to run under a virtual display --
      # the same reason this workflow cannot collect PGO profiles (see the note above).
      run: xvfb-run -a ctest --test-dir ${{github.workspace}}/build -C ${{env.BUILD_TYPE}} --output-on-failure -L "cli|unit"

    # ── Generated wxPython validation (Tier 2, non-blocking) ────────────────
    # codegen_test/run_test.cmd only py_compile's the generated modules (Tier 1).
    # These steps go one tier further: regenerate the wxPython code from
    # codegen_test.wxui, then import every module and construct every top-level
    # window it defines under a virtual display.
    #
    # wxPython wheels are per-CPython-ABI, so Python is pinned as well;
    # --only-binary=:all: makes a missing wheel fail in seconds instead of
    # triggering a 30-60 minute source build. Every step below is
    # continue-on-error, so a wheel-availability or xvfb hiccup can never
    # red-line the pipeline.

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install wxPython from a binary wheel
      continue-on-error: true
      # A block scalar keeps pip's ':all:' out of YAML's plain-scalar colon rules.
      run: |
        python -m pip install --only-binary=:all: wxPython==4.3.1

    - name: Generate wxPython code
      continue-on-error: true
      run: |
        cd ${{github.workspace}}/codegen_test
        xvfb-run -a ${{github.workspace}}/bin/${{env.BUILD_TYPE}}/wxUiEditor --gen_python codegen_test.wxui

    - name: Validate generated wxPython (Tier 2)
      continue-on-error: true
      run: |
        xvfb-run -a python ${{github.workspace}}/tests/scripts/run_wxpython.py \
            ${{github.workspace}}/codegen_test/python
