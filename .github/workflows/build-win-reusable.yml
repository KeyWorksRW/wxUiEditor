name: "Reusable Windows Build"

on:
  workflow_call:
    inputs:
      create-setup:
        description: 'Whether to create NSIS setup installer'
        required: false
        type: boolean
        default: false
      build-type:
        description: 'Build type (Debug or Release)'
        required: false
        type: string
        default: 'Release'
      create-dummy-docs:
        description: 'Create dummy wxWidgetsDocs.zip to skip docs generation (build/link verification only)'
        required: false
        type: boolean
        default: false

jobs:
  buildWindows:
    runs-on: windows-2025-vs2026
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Setup installers are Release-only: install(TARGETS wxUiEditor
    # CONFIGURATIONS Release) only installs the Release configuration, so cpack
    # would find nothing to package for any other build type. Fail fast instead
    # of letting cpack search for a configuration that will never be installed.
    - name: Validate build inputs (Setup is Release-only)
      if: ${{ inputs.create-setup && inputs.build-type != 'Release' }}
      run: |
        throw "Setup builds require build-type 'Release', but got '${{ inputs.build-type }}'."

    - name: Setup CMake 4.2+
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '~4.2.0'

    - run: mkdir ${{github.workspace}}/build

    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Create dummy wxWidgetsDocs.zip (skip docs build)
      if: ${{ inputs.create-dummy-docs }}
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ${{github.workspace}}/build/archive | Out-Null
        # Non-empty file: build_docs.cmake only checks existence, and CMakeRC
        # embeds the bytes without parsing them, so any content is fine for linking.
        echo "Dummy wxWidgets docs archive for link-time verification" > ${{github.workspace}}/build/archive/wxWidgetsDocs.zip

    - name: Configure CMake (MSVC)
      run: cmake -G "Visual Studio 18 2026" -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{inputs.build-type}}

    - name: Build wxUiEditor (MSVC)
      run: cmake --build ${{github.workspace}}/build --config ${{inputs.build-type}} --target wxUiEditor

    - name: Install NSIS
      if: ${{ inputs.create-setup }}
      shell: pwsh
      run: |
        # NSIS installs to a fixed location, and cpack's NSIS generator locates
        # makensis through the PATH -- so both the install and the PATH export
        # are required for the packaging step to work.
        $nsisDir  = 'C:\Program Files (x86)\NSIS'
        $makensis = Join-Path $nsisDir 'makensis.exe'

        if (-not (Test-Path $makensis)) {
            # winget's manifest feed is Microsoft-maintained. The Chocolatey
            # community feed returned HTTP 503 while this step still exited 0,
            # because choco reports success after installing 0/0 packages -- the
            # failure then surfaced much later, inside cpack.
            $wingetExit = -1
            if (Get-Command winget -ErrorAction SilentlyContinue) {
                winget install --id NSIS.NSIS --exact --source winget --silent `
                    --accept-package-agreements --accept-source-agreements `
                    --disable-interactivity
                $wingetExit = $LASTEXITCODE
            } else {
                Write-Host 'winget is not available on this image.'
            }

            # Last resort for images without App Installer.
            if (-not (Test-Path $makensis) -and (Get-Command choco -ErrorAction SilentlyContinue)) {
                Write-Host "winget did not install NSIS (exit code $wingetExit); falling back to choco."
                choco install nsis --no-progress -y
            }
        }

        if (-not (Test-Path $makensis)) {
            throw "NSIS is not installed: '$makensis' is missing after winget/choco."
        }

        # GITHUB_PATH only affects subsequent steps, which is where cpack runs.
        $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        & $makensis /VERSION
        if ($LASTEXITCODE -ne 0) {
            throw "'$makensis /VERSION' failed; the NSIS installation looks broken."
        }

    # Packages the MSVC build (install(TARGETS wxUiEditor CONFIGURATIONS
    # Release) only installs Release, which the setup validation enforces).
    - name: Build Setup
      if: ${{ inputs.create-setup }}
      run: |
        cd build
        cpack -G NSIS -C ${{inputs.build-type}}

    # Setup installers come from the MSVC build. Otherwise the standalone exe is
    # uploaded: the MSVC multi-config generator writes
    # bin/<config>/wxUiEditor.exe.
    - name: Create Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: ${{ inputs.create-setup && 'WindowsSetup' || 'WindowsExecutable' }}
        path: |
          ${{ inputs.create-setup && 'build/wxUiEditor-*-win64.exe' || format('bin/{0}/wxUiEditor.exe', inputs.build-type) }}
